aid: numero
name: Numero
description: 'Numero is an all-in-one donor database and call-time platform built for
  political campaigns at the federal, state, and local levels. It combines a fast, filterable
  donor CRM with auto-deduplication and pledge tracking, a mobile call-time dialer with
  one-click SMS, email, and voicemail follow-up plus virtual local numbers, prefilled
  one-click contribution forms with access to a large 1-click donor network, event and
  RSVP fundraising tools, and a deliverability-focused email platform. Campaigns use
  Numero to identify prospect donors, run efficient candidate call time, and raise money
  faster. Numero is backed by Initialized Capital. It currently exposes no public
  developer API surface; api.numero.ai serves the web application backend only.'
